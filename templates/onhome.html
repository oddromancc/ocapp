{% extends 'base.html' %}

{% block content %}

<button class="btn btn-dash" popovertarget="modal-1">Добавить резюме</button>

<div class="modal" id="modal-1" popover>
    <div class="modal-box">
        <h3 class="font-bold text-lg">Новое резюме</h3>
        <fieldset class="fieldset">
            <legend class="fieldset-legend mt-4">Выберите навыки кандидата</legend>
            <form class="filter" method="post" id="aform">
                <input class="btn" type="checkbox" name="resTags" aria-label="Flask" value="Flask">
                <input class="btn" type="checkbox" name="resTags" aria-label="Docker" value="Docker">
                <input class="btn" type="checkbox" name="resTags" aria-label="Django" value="Django">
                <input class="btn" type="checkbox" name="resTags" aria-label="Git" value="Git">
                <input class="btn" type="checkbox" name="resTags" aria-label="Dockersrts" value="Dockersrts">
                <input class="btn" type="checkbox" name="resTags" aria-label="ARIA322222" value="ARIA322222">
                <input class="btn" type="checkbox" name="resTags" aria-label="Flask22323" value="Flask22323">
                <input class="btn" type="checkbox" name="resTags" aria-label="Docker" value="Docker">
                <input class="btn" type="checkbox" name="resTags" aria-label="ARIA" value="ARIA">
                <input class="btn btn-square" type="reset" value="x">
            </form>
        </fieldset>
        <fieldset class="fieldset">
            <legend class="fieldset-legend mt-4">Введите данные кандидата</legend>
            <input type="text" class="input" placeholder="Должность" name="resTitle" form="aform" required>
            <input type="text" class="input" placeholder="Описание" name="resDesc" form="aform" required>
            <select class="select" name="resExp" form="aform" required>
                <option disabled selected>Выберите стаж</option>
                <option>Без опыта</option>
                <option>От 1 года до 3 лет</option>
                <option>От 3 до 6 лет</option>
                <option>Более 6 лет</option>
            </select>
            <select class="select" name="resEd" form="aform" required>
                <option disabled selected>Выберите образование</option>
                <option>Среднее</option>
                <option>Среднее профессиональное</option>
                <option>Высшее</option>
            </select>
            <input type="number" class="input" name="resComp" placeholder="Введите минимальную желаемую зарплату" required>

            <input class="btn btn-dash mt-4" type="submit" value="Создать резюме" form="aform">
        </fieldset>

        <div class="modal-action">
            <button popovertarget="modal-1" popovertargetaction="hide">отменить</button>
        </div>
    </div>
</div>

{% for g in rescol %}
    <div class="card bg-base-100 shadow-sm">
        <div class="card-body">
            {% for q in g %}
                <h2 class="card-title">{{ q[0] }}</h2>
                <p>{{ q[1] }}</p>
            {% endfor %}
            <div class="card-actions">
                <form method="post">
                    <input type="hidden" name="resExp1" value="{{ g[2][1] }}">
                    <input type="hidden" name="resTags1" value="{{ g[3][1] }}">
                    <input type="hidden" name="resEd1" value="{{ g[4][1] }}">
                    <input type="hidden" name="resComp1" value="{{ g[5][1] }}">
                    <button class="btn btn-primary mt-4">Подобрать вакансию</button>
                </form>
            </div>
        </div>
    </div>
{% endfor %}

{% endblock %}
